version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - emergency_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: emergency_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - emergency_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: emergency_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emergency_guide
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: laravel
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - emergency_network

networks:
  emergency_network:
    driver: bridge

volumes:
  db_data: